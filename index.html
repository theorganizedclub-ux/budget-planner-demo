*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:var(--t-body);line-height:var(--lh-body);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:var(--num-feat);}
a{color:var(--accent);}
a:hover{color:var(--ink);}
:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important;}}
html,body{height:100%;}
body{overscroll-behavior-y:none;}
h1,h2,h3,p,figure{margin:0;}
[hidden]{display:none !important;}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;grid-template-areas:"topbar" "banner" "monthrail" "main" "nav";min-height:100dvh;}
@media (max-width:1279px){.monthstrip--rail{border-bottom:1px solid var(--line);}

.topbar{grid-area:topbar;display:flex;align-items:center;gap:var(--sp-6);min-height:52px;padding:0 var(--sp-8);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:20;}
.topbar__title{font-size:var(--t-title);font-weight:var(--w-semibold);line-height:var(--lh-snug);margin:0;}
.topbar__date{margin-left:auto;font-size:var(--t-quiet);color:var(--quiet);}
.topbar__actions{margin-left:auto;display:flex;align-items:center;gap:var(--sp-4);}
.topbar__actions .topbar__date{margin-left:0;}
.bannerline{grid-area:banner;}
.banner{display:flex;align-items:center;gap:var(--sp-5);padding:var(--sp-4) var(--sp-8);border-bottom:1px solid var(--line);font-size:var(--t-quiet);background:var(--raised);}
.banner--caution{border-bottom-color:var(--caution);}
.banner__text{flex:1 1 auto;min-width:0;}
.banner__text b{font-weight:var(--w-semibold);}
.main{grid-area:main;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.screen{padding:var(--sp-8) var(--sp-8) var(--sp-11);max-width:var(--content-max);margin:0 auto;}
.screen--narrow{max-width:560px;}
.screen--mid{max-width:760px;}
.screen--wide{max-width:820px;}
.screen--cols{max-width:760px;}
.stack{display:flex;flex-direction:column;gap:var(--sp-6);}
.stack--loose{gap:var(--sp-9);}
.stack--tight{gap:var(--sp-4);}
:root,[data-theme="dark"],[data-theme="contrast"]{color-scheme:dark;}
[data-theme="light"]{color-scheme:light;}
[data-theme="auto"]{color-scheme:light dark;}
.today2col,.add2col{display:flex;flex-direction:column;gap:var(--sp-9);}
.prose{max-width:var(--measure);line-height:var(--lh-body);}
.quiet{color:var(--quiet);}
.small{font-size:var(--t-quiet);}
.sectiontitle{font-size:var(--t-title);font-weight:var(--w-semibold);line-height:var(--lh-snug);margin:0;}
.rowhead{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-6);}
.rowhead>.btn--text{white-space:nowrap;flex:0 0 auto;}
.money{font-feature-settings:var(--num-feat);font-variant-numeric:tabular-nums lining-nums;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.bottomnav{grid-area:nav;display:grid;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--ground);position:sticky;bottom:0;z-index:20;}
.jump{position:fixed;right:var(--sp-6);bottom:calc(var(--hit-nav) + var(--sp-6) + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;gap:var(--sp-3);}
.jump[hidden]{display:none;}
.jump__btn{width:var(--hit-min);height:var(--hit-min);border-radius:var(--r-pill);display:inline-flex;align-items:center;justify-content:center;background:var(--raised);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--e-toast);cursor:pointer;}
.jump__btn[hidden]{display:none;}
body.sheet-open .jump{display:none;}
.navitem{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--hit-nav);padding:var(--sp-3) var(--sp-1);background:none;border:0;cursor:pointer;color:var(--quiet);font-family:inherit;font-size:var(--t-nav);line-height:1.1;text-align:center;word-break:keep-all;}
.navitem__marker{width:18px;height:3px;border-radius:var(--r-pill);background:transparent;}
.navitem[aria-current="page"]{color:var(--ink);font-weight:var(--w-semibold);}
.navitem[aria-current="page"] .navitem__marker{background:var(--accent);}
.navitem:active{transform:scale(0.985);}
.sidebar{display:none;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-4);min-height:var(--hit-button);padding:0 var(--sp-8);border-radius:var(--r-md);border:1px solid transparent;font-family:inherit;font-size:var(--t-body);font-weight:var(--w-semibold);line-height:1.2;cursor:pointer;text-align:center;background:transparent;color:var(--ink);transition:transform var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out);}
.btn{text-box:trim-both cap alphabetic;}
.btn:active{transform:scale(0.985);}
.btn[disabled]{opacity:0.45;cursor:default;}
.btn[disabled]:active{transform:none;}
.btn--primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.btn--outline{border-color:var(--accent);color:var(--accent);border-radius:var(--r-sm);}
.btn--plain{border-color:var(--accent);color:var(--accent);border-radius:var(--r-sm);}
.btn--text{min-height:var(--hit-min);padding:0 var(--sp-3);color:var(--accent);font-weight:var(--w-regular);text-decoration:underline;text-underline-offset:3px;border-radius:var(--r-sm);}
.btn--small{min-height:var(--hit-min);padding:0 var(--sp-6);font-size:var(--t-quiet);}
.btn--block{width:100%;}
.btn:hover:not([disabled]){background:var(--raised);}
.btn--primary:hover:not([disabled]){background:var(--accent);}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--sp-5);}
.btnrow>.btn{flex:1 1 auto;}
.btnrow--tight{gap:var(--sp-4);}
.paydeck{display:flex;gap:var(--sp-5);overflow-x:auto;padding-bottom:var(--sp-4);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
.paycard{flex:0 0 auto;width:232px;scroll-snap-align:start;display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-6);border-radius:var(--r-md);background:var(--ground);border:1px solid var(--line);}
.paycard--now{border-color:var(--accent);background:var(--raised);}
.paycard__when{font-size:var(--t-nav);font-weight:var(--w-semibold);letter-spacing:0.04em;text-transform:uppercase;color:var(--quiet);}
.paycard--now .paycard__when{color:var(--accent);}
.paycard__date{font-size:var(--t-title);font-weight:var(--w-semibold);}
.paycard__left{margin-top:var(--sp-3);padding:var(--sp-4) var(--sp-5);border:1px solid var(--line-strong);border-radius:var(--r-sm);text-align:center;font-weight:var(--w-medium);white-space:nowrap;}
.paycard .row--compact{min-height:0;padding:var(--sp-2) 0;}
@media (min-width:600px){.paydeck{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));overflow-x:visible;padding-bottom:0;}
.paycard{width:auto;}}
.field{display:flex;flex-direction:column;gap:var(--sp-3);}
.field__label{font-size:var(--t-quiet);color:var(--quiet);}
.input,.select,.textarea{min-height:48px;padding:var(--sp-4) var(--sp-6);background:var(--field);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r-sm);font-family:inherit;font-size:var(--t-body);line-height:var(--lh-body);width:100%;}
.input[aria-invalid="true"]{border-color:var(--caution);}
.field__error{font-size:var(--t-quiet);color:var(--caution);}
.field__aside{align-self:flex-start;}
.textarea{min-height:80px;resize:vertical;}
.row--reorder{display:flex;align-items:stretch;gap:0;padding:0;}
.row--reorder .row__open{flex:1 1 auto;min-width:0;display:flex;align-items:center;min-height:var(--hit-row);padding:var(--sp-5) var(--sp-5) var(--sp-5) 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;}
.grip{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;min-height:var(--hit-row);background:none;border:0;color:var(--quiet);cursor:grab;touch-action:none;}
.grip:active{cursor:grabbing;}
.grip__bars{width:16px;height:12px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative;}
.grip__bars::after{content:"";position:absolute;left:0;right:0;top:50%;margin-top:-1px;border-top:2px solid currentColor;}
.row--lifted{background:var(--raised);box-shadow:inset 0 0 0 1px var(--accent);border-radius:var(--r-sm);}
.row--lifted .grip{color:var(--accent);}
.boxed,.panel,.screen>section:not(.hero),.screen>.stack>section:not(.hero){padding:var(--sp-7);border-radius:var(--r-lg);background:var(--raised);border:1px solid var(--line);box-shadow:var(--e-card);}
.panel{display:flex;flex-direction:column;gap:var(--sp-5);}
@media (min-width:1240px){.screen--cols{max-width:1180px;display:grid;align-items:start;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:var(--sp-9);}
.screen--cols.stack{gap:var(--sp-9);}}
.row.todo{align-items:flex-start;gap:var(--sp-5);}
.row.todo .row__main{padding-top:10px;padding-top:calc((44px - 1lh) / 2);}
.todo__tick{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;padding:0;}
.todo__box{width:22px;height:22px;border-radius:var(--r-pill);border:2px solid var(--line-strong);background:transparent;display:flex;align-items:center;justify-content:center;font-size:var(--t-quiet);line-height:1;}
.todo__tick[aria-checked="true"] .todo__box{border-color:var(--good);color:var(--good);}
.todo__text{overflow-wrap:anywhere;}
.todo--done .todo__text{color:var(--quiet);text-decoration:line-through;}
.btnrow--tight{gap:var(--sp-4);align-items:center;}
.btnrow--tight .input{flex:1 1 auto;min-width:0;}
.setaside{filter:blur(4px);opacity:0.45;user-select:none;transition:filter var(--dur-base) ease,opacity var(--dur-base) ease;}
@media (prefers-reduced-transparency:reduce){.setaside{filter:none;opacity:0.35;}}
@media (prefers-contrast:more){.setaside{filter:none;opacity:0.4;}}
.monthstrip{display:flex;flex-direction:column;gap:var(--sp-4);padding:var(--sp-5);border-radius:var(--r-md);background:var(--raised);border:1px solid var(--line);}
.monthstrip__head{display:flex;align-items:center;gap:var(--sp-4);}
.monthstrip__year{font-weight:var(--w-semibold);}
.monthstrip__head .btn{margin-left:auto;}
.monthstrip__step{min-width:44px;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:inherit;font-size:var(--t-title);cursor:pointer;}
.monthstrip__months{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(44px,1fr);gap:var(--sp-2);overflow-x:auto;padding-bottom:var(--sp-2);scroll-snap-type:x proximity;}
.monthchip{min-height:44px;padding:var(--sp-3) var(--sp-1);border-radius:var(--r-sm);border:1px solid var(--line-strong);background:transparent;color:var(--quiet);font-family:inherit;font-size:var(--t-quiet);cursor:pointer;scroll-snap-align:center;white-space:nowrap;}
.monthchip--1{background:var(--mon-1);}
.monthchip--2{background:var(--mon-2);}
.monthchip--3{background:var(--mon-3);}
.monthchip--4{background:var(--mon-4);}
.monthchip--5{background:var(--mon-5);}
.monthchip--6{background:var(--mon-6);}
.monthchip--7{background:var(--mon-7);}
.monthchip--8{background:var(--mon-8);}
.monthchip--9{background:var(--mon-9);}
.monthchip--10{background:var(--mon-10);}
.monthchip--11{background:var(--mon-11);}
.monthchip--12{background:var(--mon-12);}
.monthchip[class*="monthchip--"]:not(.monthchip--on){color:var(--mon-ink);border-color:transparent;}
.monthchip[class*="monthchip--"]:not(.monthchip--on):hover{filter:brightness(1.06);}
.monthchip--on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:var(--w-semibold);box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--accent);}
.monthrail{grid-area:monthrail;min-width:0;}
.monthrail[hidden]{display:none;}
.monthstrip--rail{border:0;border-radius:0;background:var(--ground);padding:var(--sp-4) var(--sp-3);gap:var(--sp-2);}
.monthstrip--rail .monthstrip__head{gap:var(--sp-1);justify-content:center;}
.monthstrip--rail .monthstrip__year{font-size:var(--t-quiet);}
.monthstrip--rail .monthstrip__step{min-width:28px;min-height:28px;font-size:var(--t-quiet);border-radius:var(--r-sm);}

'help.formula.body': 'It starts from the balance you confirmed. It adds money that arrived after that, takes off what you have spent since, takes off bills still to leave before payday, and takes off anything kept aside. What is left is divided over the days until payday. Today’s spending is added back before dividing, so the figure does not shrink as you log.',
'help.privacy.title': 'What is stored, and where',
'help.privacy.body': 'Everything stays in this browser on this device. There is no account, no server and no bank connection. Clearing your browsing data for this site erases it, and so does deleting the app. A backup file is the only copy that survives that.',
'help.privacy.file': 'Because this is a file on your device, every page opened from a file on this device shares the same storage.',
'help.install.title': 'Keeping your numbers safe',
'help.install.body': 'Keep this file somewhere you will find it again and bookmark the tab. Save a backup once you have added your numbers, and again whenever a lot has changed.',

'help.aria': 'Explain {section}',
'help.balance': 'Most banking apps show more than one figure. You want the account your card actually spends from. It is usually the first one on the home screen, called current, chequing or everyday.\nIf that account shows both a balance and an available balance, use the available one. It already has pending card payments taken off, so it is closer to what is really there.\nLeave savings out, and leave credit cards out: a credit limit is not money you have.\nIf you are not sure, type your best guess. You can correct it in a minute from Check my money, and nothing you type leaves this device.',
'help.paysources': 'Money that arrives on its own rhythm, beside your main pay: a second job, a partner’s pay, a regular payment in.\nThe number runs to the day before the next money arrives, from whichever source arrives first. Adding one here can shorten the stretch your money has to cover, and that is the point of it.\nThis is the timing only. The money itself still counts when you confirm it has arrived, the same as your pay.'
,
'help.payday': 'The date the money actually lands, not the date it is due. That date is what the days until payday are counted to.\nIf your pay arrives early when payday falls on a weekend, turn that on and the count runs to the Friday instead.',
'help.bills.before': 'Only what has to leave before your next payday. Rough is fine. A bill you forget makes the number look better than it is, which is the one direction that hurts.\nAnything due on or after payday is left out on purpose, because that pay covers it.',
'help.hero': 'What is safe to spend today if you want the money to last until payday: your balance, minus what you have spent since, minus the bills still to leave, divided over the days that are left.\nIt is a guide, not a limit. Nothing is blocked if you go past it, and tomorrow adjusts.',
'help.guidebar': 'The bar fills as you log spending today. The figure on the right is what the day opened with, so logging a spend never makes the bar jump backwards.',
'help.smallthings': 'Up to three things that would make the number more accurate, worked out from what is actually in the app. The section disappears entirely when there is nothing to do.',
'help.nextbills': 'The bills due before your next payday, so you can tick them off as they leave. Ticking one does not change the number. It only moves it from still to come to already out.',
'help.recentspends': 'The last few things you logged. Tap one to change the amount, category, date, account or note, or to delete it. See all opens every transaction.',
'help.calculation': 'Every row is arithmetic you can check with a calculator, and the number in brackets opens the records behind that row.\nIf a figure on screen cannot be reproduced from these rows, that is a bug and worth telling me about.',
'guide.idea.title': 'The idea in one sentence',
'guide.idea': 'The planner takes the money you can really use until your next payday and divides it by the days left. That is what you can spend today without running short before your next pay.',
'guide.steps.title': 'The calculation, step by step',
'guide.step.1': 'Start with what is in your everyday and cash accounts (the balance you entered, or the starting balance).',
'guide.step.2': 'Add money that has really arrived.',
'guide.step.3': 'Take off everything already spoken for before payday (the second table below).',
'guide.step.4': 'Divide what is left by the days until payday.',
'guide.step.5': 'Take off what you have already spent today.',

'help.fit': 'Type an amount and see what today and the rest of the period would look like afterwards. Nothing is saved: it is a question, not a decision.',
'help.check.s2': 'Ticking one here means the money has already left your account, so it stops being held back rather than being taken off twice. Your new balance is the only thing that changes the number.',
'help.check.s3': 'What Today will show once you save. Nothing is written until you press the button.',
'help.add.cats': 'One tap on a category saves the spend. There is no confirm step, because undo sits at the bottom of the screen for ten seconds afterwards.',
'help.add.note': 'Optional. Worth it when the category alone will not remind you what this was in three weeks.',
'help.add.date': 'Today unless you say otherwise. Dating something before your last balance check asks once whether the bank had already taken it, so it is never counted twice.',
'help.add.again': 'On, the screen stays put with the amount cleared. A shop run paid in four separate goes is then four taps rather than four trips back here.',
'help.bills.summary': 'Only bills due before your next payday count towards today’s number. Anything due on or after payday is paid by that pay, so counting it now would make today look worse than it is.',
'help.bills.recurrence': 'Pick how often it comes back and every future date is worked out from the first one. Day 31 means the last day of the month, so February looks after itself.',
'help.month.tiles': 'Totals for the month from what you logged, never a projection. Out includes bills that have left your account.',
'help.month.calendar': 'Each day lists what is on it, coloured as in the key above the calendar: still to pay, already paid (struck through), money in, spending and notes. “Balance” is that day only: what came in that day less what went out.\nOn a phone the days are too small for words, so marks stand in, told apart by shape as well as colour: an upright bar for pay, an outlined bar for a bill still to pay, a filled bar for one that has gone, and a dot for spending.',
'help.theme': 'Dark is the default. Auto follows whatever your phone or computer is set to and changes with it. High contrast is pure black and white, and is worth trying if reading feels like hard work.',
'help.size': 'This scales everything, not just the body text. The big number grows least, so it still fits on a narrow screen.',
'help.currency': 'Sets the symbol, the decimal point and the thousands separator. It converts nothing. It simply describes the money you are typing.',
'help.categories': 'The buttons you tap to save a spend. Name them whatever you would actually call them in a hurry, and put the ones you use most at the top.',
'help.you': 'Only used to greet you and to name the planner. It stays on this device.',
'help.kept': 'Money you have decided not to touch: a deposit, a present, whatever it is for. It stays in your bank account; the number here pretends it is not there so you do not spend it by accident.',
'help.buffer': 'A cushion held back on top of anything kept aside. Some people like knowing the real figure is quietly a little higher than the one on screen.',
'help.cadence': 'A balance a week old has drifted. This is how often the app suggests a fresh one. It never checks anything by itself. There is no bank connection.',
'help.balanceRow': 'The last figure you confirmed, and when. Everything on Today is worked out from this, which is why an old one gets a nudge.',
'help.simple': 'Hides Month and Settings from the bar at the bottom, leaving Today, Add, Bills and Check my money. Today keeps a link back to everything.',
'help.focus': 'Today drops to the number and the one thing that needs you. Everything else is still there in the bar at the bottom.',
'help.data.backup': 'One file with everything in it. It is the only copy that survives clearing your browser data or losing the device, so it is worth doing once your real numbers are in.',
'help.data.restore': 'Replaces everything on this device with what is in the file. You see a preview first, and what was here before is kept in Recently changed.',
'help.data.csv': 'Your spending, bills and money in, for anything this app does not do. The spreadsheet (.xlsx) keeps amounts as numbers and dates as dates, with the header row frozen and filters on. The CSV file is the same rows as plain text.',
'help.data.recent': 'The last twenty changes, newest first, each with an undo. It is a record of what happened, not a warning.',
'help.data.erase': 'Clears this device completely. There is no copy anywhere else, so save a backup first if there is any chance you want it back.',

const inRange = (d) => !!d && d >= from && d <= to;
const rows = [];
const splits = new Map();
for (const t of s.transactions) {
if (!inRange(t.date) || ctx.isCardPayoff(t)) continue;
const occ = t.linkedBillOccurrenceId && s.billOccurrences.find((o) => o.id === t.linkedBillOccurrenceId);
if (occ) {
const bill = s.bills.find((b) => b.id === occ.billId) || {};
rows.push({ key: `t:${t.id}`, kind: 'bill', date: t.date, seq: t.seq || 0, name: bill.name || ctx.t('nav.bills'), note: '',
categoryId: bill.categoryId || null, accountId: t.accountId, cents: -t.amountCents, amountCents: t.amountCents,
absorbed: !!t.absorbed, ref: { type: 'bill', id: occ.id } });
continue;
}
if (t.linkedDebtPaymentId) {
rows.push({ key: `t:${t.id}`, kind: 'debt', date: t.date, seq: t.seq || 0, name: t.note || ctx.t('nav.debts'), note: '',
categoryId: null, accountId: t.accountId, cents: -t.amountCents, amountCents: t.amountCents,
absorbed: !!t.absorbed, ref: { type: 'debt', id: t.linkedDebtPaymentId } });
continue;
}
if (t.splitId) {
const g = splits.get(t.splitId);
if (g) {
g.parts.push(t); g.amountCents += t.amountCents; g.cents -= t.amountCents;
g.categoryIds.push(t.categoryId); g.seq = Math.max(g.seq, t.seq || 0);
if (!g.note && t.note) { g.note = t.note; g.name = t.note; }
continue;
}
const row = { key: `s:${t.splitId}`, kind: 'split', date: t.date, seq: t.seq || 0, name: t.note || '', note: t.note || '',
categoryId: null, categoryIds: [t.categoryId], accountId: t.accountId, cents: -t.amountCents, amountCents: t.amountCents,
absorbed: !!t.absorbed, parts: [t], ref: { type: 'split', id: t.splitId } };
splits.set(t.splitId, row);
rows.push(row);
continue;
}
rows.push({ key: `t:${t.id}`, kind: t.amountCents < 0 ? 'refund' : 'spend', date: t.date, seq: t.seq || 0,
name: t.note || ctx.categoryName(t.categoryId), note: t.note || '', categoryId: t.categoryId || null,
accountId: t.accountId, cents: -t.amountCents, amountCents: Math.abs(t.amountCents),
absorbed: !!t.absorbed, ref: { type: 'spend', id: t.id } });
}
for (const g of splits.values()) {
if (!g.name) g.name = ctx.t('split.name', { n: g.parts.length });
g.ref.group = { ...g.parts[0], id: g.ref.id, amountCents: g.amountCents, parts: g.parts };
}
for (const o of s.billOccurrences) {
if (!o.paid || o.skipped || !inRange(o.paidDate || o.due)) continue;
if (s.transactions.some((t) => t.linkedBillOccurrenceId === o.id)) continue;
const bill = s.bills.find((b) => b.id === o.billId) || {};
rows.push({ key: `o:${o.id}`, kind: 'bill', date: o.paidDate || o.due, seq: 0, name: bill.name || ctx.t('nav.bills'), note: '',
categoryId: bill.categoryId || null, accountId: bill.accountId || ctx.defaultAccountId(), cents: -o.amountCents,
amountCents: o.amountCents, absorbed: true, ref: { type: 'bill', id: o.id } });
}
for (const i of ctx.loggedIncome()) {
if (!i.confirmed || !inRange(i.date)) continue;
rows.push({ key: `i:${i.id}`, kind: 'in', date: i.date, seq: i.seq || 0, name: i.label || ctx.t('moneyin.title'), note: '',
categoryId: null, accountId: i.accountId, cents: i.amountCents, amountCents: i.amountCents,
absorbed: !!i.absorbed, ref: { type: 'in', id: i.id } });
}
for (const tr of ctx.transferList()) {
if (!inRange(tr.date)) continue;
const debt = tr.debtId && ctx.debts().find((d) => d.id === tr.debtId);
rows.push({ key: `x:${tr.id}`, kind: debt ? 'debt' : 'transfer', date: tr.date, seq: tr.seq || 0,
name: debt ? ctx.t('debt.pay.note', { name: debt.name }) : ctx.t('acct.transfer.row', { from: ctx.accountName(tr.from), to: ctx.accountName(tr.to) }),
note: '', categoryId: null, accountId: tr.from, toAccountId: tr.to, cents: debt ? -(tr.amountCents || 0) : 0,
amountCents: tr.amountCents || 0, absorbed: false, ref: { type: 'transfer', id: tr.id } });
}
return rows.sort((a, b) => (a.date === b.date ? b.seq - a.seq : (a.date < b.date ? 1 : -1)));
};
ctx.moveMatches = (row, query) => {
const q = String(query || '').trim().toLowerCase();
if (!q) return true;
const words = [row.name, row.note, row.categoryId ? ctx.categoryName(row.categoryId) : '',
...(row.categoryIds || []).map((id) => ctx.categoryName(id)),
ctx.accountName(row.accountId), row.toAccountId ? ctx.accountName(row.toAccountId) : ''].join(' ').toLowerCase();
if (words.includes(q)) return true;
const num = q.replace(/[^0-9.,]/g, '').replace(',', '.');
if (!num || !/\d/.test(num)) return false;
const amount = (row.amountCents / 100).toFixed(2);
return amount.startsWith(num) || amount === Number(num).toFixed(2);
};

ctx.isAutopay = (billId) => !!(store.state.bills.find((b) => b.id === billId) || {}).autopay;
ctx.settleAutopay = () => {
const today = ctx.today();
const auto = new Set(store.state.bills.filter((b) => b.autopay).map((b) => b.id));
if (!auto.size) return 0;
const due = store.state.billOccurrences.filter((o) => auto.has(o.billId)
&& !o.paid && !o.skipped && !o.autopayDeclined && o.due <= today);

occ.paid = true;
occ.paidDate = occ.due;
occ.autopaid = true;
occ.absorbed = inBalance;
if (!inBalance) {
s.transactions.push({
id: newId('t'), seq: store.nextSeq(), date: occ.due,
amountCents: occ.amountCents, categoryId: bill.categoryId || null, note: '',
accountId: bill.accountId || ctx.defaultAccountId(), absorbed: false,
linkedBillOccurrenceId: occ.id, createdAt: new Date().toISOString(),
});
}
}
}, { params: { n: due.length } });

ctx.lastBillCarried = 0;
ctx.saveBill = (bill) => {
ctx.lastBillCarried = 0;
store.commit('undo.bill.saved', (s) => {
const existing = bill.id && s.bills.find((b) => b.id === bill.id);
if (existing) {
const moved = existing.firstDue !== bill.firstDue
|| JSON.stringify(existing.recurrence || {}) !== JSON.stringify(bill.recurrence || {});
Object.assign(existing, bill);
const today = ctx.today();
const mine = (o) => o.billId === bill.id && o.due >= today;
const carried = moved
? s.billOccurrences.filter((o) => mine(o) && (o.paid || o.skipped))
.sort((a, b) => (a.due < b.due ? -1 : 1))
: [];
s.billOccurrences = s.billOccurrences.filter(
(o) => !mine(o) || (!moved && (o.paid || o.skipped))
);
ctx.refreshOccurrences(s);
const fresh = s.billOccurrences.filter(mine).sort((a, b) => (a.due < b.due ? -1 : 1));
carried.forEach((old, i) => {
const target = fresh[i];
if (!target) { s.billOccurrences.push(old); return; }
target.paid = old.paid;
target.paidDate = old.paidDate;
target.skipped = old.skipped;
target.absorbed = old.absorbed;
if (old.paid) target.amountCents = old.amountCents;
for (const tx of s.transactions) {
if (tx.linkedBillOccurrenceId === old.id) tx.linkedBillOccurrenceId = target.id;
}
ctx.lastBillCarried += 1;
});
s.billOccurrences.sort((a, b) => (a.due === b.due ? (a.id < b.id ? -1 : 1) : (a.due < b.due ? -1 : 1)));
} else {
s.bills.push({ ...bill, id: bill.id || newId('b'), createdSeq: store.nextSeq() });
ctx.refreshOccurrences(s);
}
}, { params: { bill: bill.name } });

ctx.upcomingPaydays = (count = 6) => {
const today = ctx.today();
const opened = lastPayday(ctx.paySchedules(), today) || ctx.settings().createdAt || today;
const far = addMonths(today, 18, 1);
const paydays = paydaysInWindow(ctx.paySchedules(), today, far).filter((d) => d > today);
const starts = [opened, ...paydays].slice(0, count + 1);
const goalsPerPayday = ctx.goals()
.filter((g) => g.keptOut)
.map((g) => ctx.goalState(g))
.filter((g) => !g.done)
.reduce((a, g) => a + g.perPayday, 0);
const periods = [];
for (let i = 0; i < Math.min(starts.length, count); i += 1) {
const start = starts[i];
const end = starts[i + 1] ? addDays(starts[i + 1], -1) : addDays(start, 30);
const comingIn = ctx.expectedIncome(start, end).reduce((a, x) => a + x.amountCents, 0);
const billsCents = store.state.billOccurrences
.filter((o) => !o.skipped && o.due >= start && o.due <= end)
.reduce((a, o) => a + o.amountCents, 0);
periods.push({
start, end, isNow: i === 0,
comingInCents: comingIn, billsCents, goalsCents: goalsPerPayday,
leftCents: comingIn - billsCents - goalsPerPayday,
});
}
return periods;
};

function download(ctx, filename, text, mime) {
try {
const blob = new Blob([text], { type: mime });
const url = URL.createObjectURL(blob);
const link = el('a', { href: url, download: filename });
document.body.appendChild(link);
link.click();
link.remove();
setTimeout(() => URL.revokeObjectURL(url), 4000);
return true;
} catch {
return false;
}

function toCsv(rows) {
